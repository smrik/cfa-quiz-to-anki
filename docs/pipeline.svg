<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Pipeline: CFA quiz review page, userscript panel, TSV, Anki card">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: none; }
    .box   { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
    .accent{ fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .ok    { fill: #eefaf4; stroke: #16a05d; stroke-width: 1.5; }
    .t     { fill: #202124; font-family: -apple-system, Segoe UI, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; fill: #6b7280; }
    .arrow { stroke: #9aa3af; stroke-width: 1.6; fill: none; }
    .head  { fill: #9aa3af; }
    @media (prefers-color-scheme: dark) {
      .box    { fill: #1f2430; stroke: #3b4252; }
      .accent { fill: #17293f; stroke: #3b82f6; }
      .ok     { fill: #173528; stroke: #4aca87; }
      .t      { fill: #e8eaed; }
      .sub, .mono { fill: #9aa3af; }
      .arrow, .head { stroke: #6b7280; fill: #6b7280; }
      .arrow { fill: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="260"/>

  <!-- 1. Review page -->
  <rect class="box" x="18" y="52" width="190" height="118" rx="10"/>
  <text class="t title" x="36" y="82">Quiz Review page</text>
  <text class="t sub"   x="36" y="104">learn.cfainstitute.org</text>
  <text class="t sub"   x="36" y="121">→ LTI iframe</text>
  <text class="t mono"  x="36" y="145">insproserv.net</text>
  <text class="t sub"   x="36" y="162">21 questions</text>

  <!-- 2. Userscript -->
  <rect class="accent" x="248" y="52" width="190" height="118" rx="10"/>
  <text class="t title" x="266" y="82">Userscript panel</text>
  <text class="t sub"   x="266" y="104">document-order walk</text>
  <text class="t sub"   x="266" y="121">MathML → text</text>
  <text class="t sub"   x="266" y="138">2 feedback layouts</text>
  <text class="t sub"   x="266" y="162">Topic prompt</text>

  <!-- 3. TSV -->
  <rect class="box" x="478" y="52" width="190" height="118" rx="10"/>
  <text class="t title" x="496" y="82">TSV</text>
  <text class="t sub"   x="496" y="104">8 columns, no header</text>
  <text class="t mono"  x="496" y="126">Question, OptionA…</text>
  <text class="t mono"  x="496" y="143">…Topic, Source</text>
  <text class="t sub"   x="496" y="162">clipboard or file</text>

  <!-- 4. Anki -->
  <rect class="ok" x="708" y="52" width="174" height="118" rx="10"/>
  <text class="t title" x="726" y="82">Anki</text>
  <text class="t sub"   x="726" y="104">smrik - CFA MCQ</text>
  <text class="t sub"   x="726" y="121">click to answer</text>
  <text class="t sub"   x="726" y="138">green / red reveal</text>
  <text class="t sub"   x="726" y="162">explanation on back</text>

  <!-- arrows -->
  <g class="arrow">
    <path d="M208 111 H238"/>
    <path d="M438 111 H468"/>
    <path d="M668 111 H698"/>
  </g>
  <g class="head">
    <polygon points="238,111 230,107 230,115"/>
    <polygon points="468,111 460,107 460,115"/>
    <polygon points="698,111 690,107 690,115"/>
  </g>

  <text class="t sub" x="18" y="215">Only the questions you got wrong, by default — “mistakes only” gave 11 of 21 on the first real run.</text>
  <text class="t mono" x="18" y="236">Anki imports by column POSITION. FIELDS in the script must match the note type's field order exactly.</text>
</svg>
